<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ヒフミヨ</title>
<meta name="description" content="体験・学び・アイデアを記録して創作に活かすメモアプリ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#f3f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1c23" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ヒフミヨ">
<style>
/* Layout: one-column notebook (max 760px) for 検索・メモ画面; 閲覧画面 splits into 本文 + resizable AI panel on the right edge. */
:root {
  --bg: #f3f4f8;
  --surface: #ffffff;
  --surface-2: #eceef5;
  --line: #dfe2ec;
  --ink: #2c2f3d;
  --ink-2: #636879;
  --ink-3: #6e7386;
  --accent: #6f7bc4;
  --accent-soft: #e4e7f7;
  --accent-ink: #4b56a0;
  --g-exp: #fbe3d8;  --g-exp-ink: #9a5539;
  --g-learn: #d9f0e6; --g-learn-ink: #2f7a5c;
  --g-idea: #ece3f8; --g-idea-ink: #6a4ba3;
  --ok: #d6efe2; --ok-ink: #2d6f51;
  --ng: #f8dde0; --ng-ink: #a23b4b;
  --scrim: rgba(40, 42, 58, .38);
  --shadow: 0 1px 2px rgba(44,47,61,.06), 0 6px 20px rgba(44,47,61,.07);
  --bar-search: #d5e2fb; --bar-view: #c9ece3; --bar-list: #ead6f7; --bar-edit: #fadfc0; --bar-report: #f5eaa6;
  --tc-rose: #c2475f; --tc-orange: #b5651d; --tc-green: #2c8560; --tc-blue: #356bb0; --tc-purple: #7650b5; --tc-gray: #71768a; --tc-brown: #8a573f;
  --hl-yellow: #fff0a6; --hl-pink: #ffd9e2; --hl-green: #d2f1dc; --hl-blue: #d7e7ff; --hl-purple: #eadfff;
  --danger: #c9566a;
  /* X（旧Twitter）と同じく端末標準のゴシック体（Android は Noto Sans JP、iPhone はヒラギノ、PC は游ゴシック/メイリオ等） */
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Noto Sans CJK JP", "Yu Gothic UI", Meiryo, Helvetica, Arial, sans-serif;
  --font-title: var(--font-body);
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1c23; --surface: #24262f; --surface-2: #2c2f3a; --line: #363a47;
    --ink: #e7e8f0; --ink-2: #b2b6c5; --ink-3: #a3a8b9;
    --accent: #a5aeea; --accent-soft: #333852; --accent-ink: #c4caf5;
    --g-exp: #4a352e; --g-exp-ink: #f3c4ae;
    --g-learn: #2b4239; --g-learn-ink: #a9e1c8;
    --g-idea: #3b3350; --g-idea-ink: #d3c2f2;
    --ok: #26463a; --ok-ink: #b5e8cf; --ng: #4d2c33; --ng-ink: #f5c0c8;
    --scrim: rgba(0,0,0,.55);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
    --bar-search: #2b4a86; --bar-view: #1e6457; --bar-list: #5b3a8c; --bar-edit: #7a4e1e; --bar-report: #6a5d12; --danger: #e48a9a;
    --tc-rose: #f29aac; --tc-orange: #f2b47c; --tc-green: #86d6ad; --tc-blue: #97bdf2; --tc-purple: #c6abf4; --tc-gray: #a9aec0; --tc-brown: #d9ab93;
    --hl-yellow: #5e5222; --hl-pink: #5c2f3c; --hl-green: #2a4c39; --hl-blue: #28405f; --hl-purple: #3f3360;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1c23; --surface: #24262f; --surface-2: #2c2f3a; --line: #363a47;
  --ink: #e7e8f0; --ink-2: #b2b6c5; --ink-3: #a3a8b9;
  --accent: #a5aeea; --accent-soft: #333852; --accent-ink: #c4caf5;
  --g-exp: #4a352e; --g-exp-ink: #f3c4ae;
  --g-learn: #2b4239; --g-learn-ink: #a9e1c8;
  --g-idea: #3b3350; --g-idea-ink: #d3c2f2;
  --ok: #26463a; --ok-ink: #b5e8cf; --ng: #4d2c33; --ng-ink: #f5c0c8;
  --scrim: rgba(0,0,0,.55);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
  --bar-search: #2b4a86; --bar-view: #1e6457; --bar-list: #5b3a8c; --bar-edit: #7a4e1e; --bar-report: #6a5d12; --danger: #e48a9a;
  --tc-rose: #f29aac; --tc-orange: #f2b47c; --tc-green: #86d6ad; --tc-blue: #97bdf2; --tc-purple: #c6abf4; --tc-gray: #a9aec0; --tc-brown: #d9ab93;
  --hl-yellow: #5e5222; --hl-pink: #5c2f3c; --hl-green: #2a4c39; --hl-blue: #28405f; --hl-purple: #3f3360;
  color-scheme: dark;
}

/* ダークモード: 屋外でも画面を見分けられるよう、バーは色を濃く（明るく）し、バーの上の文字・アイコンは明るくする */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) :is(.topbar, .edit-actions, .select-bar) { --ink-2: #e2e4ec; --ink-3: #c9ccd8; --accent-ink: #e3e6ff; }
}
:root[data-theme="dark"] :is(.topbar, .edit-actions, .select-bar) { --ink-2: #e2e4ec; --ink-3: #c9ccd8; --accent-ink: #e3e6ff; }

* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.7;
  -webkit-text-size-adjust: 100%;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent-ink); }

/* ---------- shell ---------- */
.screen { min-height: 100%; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar-in {
  max-width: 760px; margin: 0 auto; padding: 8px 16px;
  display: flex; align-items: center; gap: 8px; min-height: 52px;
}
.topbar-in.wide { max-width: none; }
.topbar h1 { font-size: 16px; font-weight: 700; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand { display: flex; align-items: baseline; gap: 8px; flex: 1; min-width: 0; }
.brand b { font-family: var(--font-title); font-size: 20px; letter-spacing: .04em; }
.brand small { color: var(--ink-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn {
  border: 0; background: transparent; border-radius: 10px; min-width: 40px; height: 40px;
  display: inline-grid; place-items: center; color: var(--ink-2); padding: 0 8px; font-size: 14px;
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn.ico { color: var(--ink-2); }
.icon-btn.ico svg { width: 21px; height: 21px; }
.icon-btn:disabled { opacity: .45; }
.head-actions { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; }
.icon-btn.back { font-size: 22px; color: var(--ink); }
.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 10px; padding: 7px 14px; font-size: 14px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
a.btn { text-decoration: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.danger { color: var(--ng-ink); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn:disabled { opacity: .5; cursor: default; }
.wrap { max-width: 760px; width: 100%; margin: 0 auto; padding-inline: 16px; padding-block: 16px 120px; }

/* theme switch */
.switch { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); border: 0; background: none; padding: 6px; }
.switch .track { width: 34px; height: 20px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); position: relative; transition: background .2s; }
.switch .knob { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--ink-3); transition: transform .2s, background .2s; }
.switch[aria-checked="true"] .track { background: var(--accent-soft); }
.switch[aria-checked="true"] .knob { transform: translateX(14px); background: var(--accent); }

/* storage notice */
.notice { font-size: 12px; color: var(--ink-2); background: var(--surface-2); border-radius: 10px; padding: 8px 12px; margin-bottom: 12px; }

/* ---------- search screen ---------- */
.searchbox { position: relative; }
.search-row { display: flex; gap: 8px; }
.search-input {
  flex: 1; min-width: 0; height: 46px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); padding: 0 14px 0 40px; font-size: 16px;
}
.search-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search-ico { position: absolute; left: 13px; top: 13px; width: 20px; height: 20px; color: var(--ink-3); pointer-events: none; }
.search-go { height: 46px; padding: 0 16px; }
.history {
  position: absolute; left: 0; right: 0; top: 52px; z-index: 15;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
  padding: 6px; max-height: 300px; overflow: auto;
}
.history-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--ink-3); padding: 4px 8px; }
.history-head button { border: 0; background: none; color: var(--ink-3); font-size: 12px; }
.history-item { display: flex; width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 8px; gap: 10px; align-items: center; }
.history-item:hover { background: var(--surface-2); }
.history-item span { color: var(--ink-3); font-size: 13px; }

.toolbar-row { display: flex; align-items: center; gap: 8px; margin-block: 14px 10px; flex-wrap: wrap; }
.tabs { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; }
.tabs button { border: 0; background: transparent; border-radius: 8px; padding: 5px 14px; font-size: 15px; color: var(--ink-2); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.spacer { flex: 1; }
.result-meta { font-size: 14.5px; color: var(--ink-2); }
.filter-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--accent-soft); color: var(--accent-ink); border-radius: 999px; padding: 3px 4px 3px 12px; font-size: 14.5px; }
.filter-chip button { border: 0; background: none; color: inherit; width: 22px; height: 22px; border-radius: 50%; }

.memo-list { display: grid; gap: 12px; }
.memo-card {
  display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface);
  border-radius: var(--radius); padding: 12px 14px; color: inherit;
}
.memo-card:hover { border-color: var(--accent); }
/* 1件ごとの境界を分かりやすく: 左端にジャンルの色の帯＋はっきりした枠と影 */
.memo-card { border-color: color-mix(in srgb, var(--line) 70%, var(--ink-3)); border-left: 6px solid var(--card-accent, color-mix(in srgb, var(--line) 50%, var(--ink-3))); box-shadow: 0 1px 3px rgba(0, 0, 0, .07); }
.memo-card.cg-体験 { --card-accent: color-mix(in srgb, var(--g-exp-ink) 65%, var(--surface)); }
.memo-card.cg-学び { --card-accent: color-mix(in srgb, var(--g-learn-ink) 65%, var(--surface)); }
.memo-card.cg-アイデア { --card-accent: color-mix(in srgb, var(--g-idea-ink) 65%, var(--surface)); }
.card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.card-head { display: flex; align-items: baseline; gap: 10px; }
.card-title { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; flex: 1; min-width: 0; }
.card-date { font-size: 13px; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }
.card-title.untitled { color: var(--ink-3); font-weight: 500; }
.card-sum { font-size: 14.5px; line-height: 1.6; color: var(--ink-2); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.card-sum mark { background: var(--accent-soft); color: var(--accent-ink); border-radius: 3px; padding: 0 1px; }
.card-foot { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; align-items: center; }
.btn.add-memos { width: 100%; justify-content: center; margin-bottom: 10px; border-style: dashed; color: var(--accent-ink); background: transparent; }
.list-tag.link { background: none; font-family: inherit; cursor: pointer; }
.list-tag.link:hover { border-color: var(--accent); color: var(--accent-ink); }
.list-tag { font-size: 12px; color: var(--ink-2); border: 1px dashed var(--line); border-radius: 6px; padding: 0 7px; }
.att-count { font-size: 13px; color: var(--ink-3); }

.genre { display: inline-flex; align-items: center; font-size: 13px; font-weight: 500; border-radius: 999px; padding: 1px 9px; line-height: 1.6; }
.genre.g-体験 { background: var(--g-exp); color: var(--g-exp-ink); }
.genre.g-学び { background: var(--g-learn); color: var(--g-learn-ink); }
.genre.g-アイデア { background: var(--g-idea); color: var(--g-idea-ink); }
.genre.none { background: var(--surface-2); color: var(--ink-3); }

.list-rows { display: grid; gap: 8px; }
.toolbar-row { column-gap: 6px; }
.toolbar-row > .btn.ghost { padding-inline: 6px; }
.genre-select { height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); padding: 0 8px; font-size: 13.5px; max-width: 100%; }
.genre-select.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-ink); font-weight: 700; }
.genre-filter { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.gf-label { font-size: 12px; color: var(--ink-3); margin-right: 2px; }
.gf { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 12px; font-size: 13px; color: var(--ink-2); }
.gf[aria-pressed="true"].all { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); }
.gf[aria-pressed="true"].g-体験 { background: var(--g-exp); color: var(--g-exp-ink); border-color: var(--g-exp-ink); }
.gf[aria-pressed="true"].g-学び { background: var(--g-learn); color: var(--g-learn-ink); border-color: var(--g-learn-ink); }
.gf[aria-pressed="true"].g-アイデア { background: var(--g-idea); color: var(--g-idea-ink); border-color: var(--g-idea-ink); }
.crumbs { display: flex; align-items: center; gap: 4px; padding: 0 16px 8px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; font-size: 12.5px; max-width: 760px; margin: 0 auto; }
.crumbs.wide { max-width: none; }
.crumbs::-webkit-scrollbar { display: none; }
.crumb { border: 0; background: none; padding: 2px 4px; border-radius: 6px; color: var(--accent-ink); text-decoration: underline; text-underline-offset: 2px; flex: 0 0 auto; }
.crumb.home { font-family: var(--font-title); font-weight: 700; text-decoration: none; }
.crumb.current { color: var(--ink-2); text-decoration: none; font-weight: 700; }
.crumb-sep { color: var(--ink-3); flex: 0 0 auto; }
button.brand { border: 0; background: none; padding: 0; text-align: left; color: inherit; cursor: pointer; }
/* bar colors per screen（屋外でも見分けやすいよう、画面ごとに色相を分ける） */
.topbar.bar-search { background: var(--bar-search); }
.topbar.bar-view { background: var(--bar-view); }
.topbar.bar-list { background: var(--bar-list); }
.topbar.bar-edit { background: var(--bar-edit); }
.topbar.bar-report { background: var(--bar-report); }
/* 画面下に固定されるバー（選択モード）も、その画面の色にする */
.screen:has(.bar-search) { --sel-bar: var(--bar-search); }
.screen:has(.bar-list) { --sel-bar: var(--bar-list); }
/* sticky search tools (inside the sticky header) */
.search-tools { max-width: 760px; margin: 0 auto; padding: 4px 16px 0; }
.search-tools .toolbar-row { margin: 8px 0 8px; flex-wrap: nowrap; }
.search-tools .tabs { flex: 0 0 auto; }
.search-tools .tabs button { padding: 6px 14px; white-space: nowrap; }
.search-tools .spacer { min-width: 0; }
.search-tools .genre-select { padding: 0 6px; font-size: 14.5px; height: 38px; min-width: 0; }
/* tags */
.tag-mini { font-size: 13.5px; color: var(--accent-ink); }
.tag-row { margin-top: 6px; }
.tag-chip { border: 1px solid var(--line); background: var(--surface); color: var(--accent-ink); border-radius: 999px; padding: 1px 10px; font-size: 13px; }
.tag-chip:hover { border-color: var(--accent); }
.tag-add { display: flex; gap: 6px; margin-top: 8px; }
.tag-input { height: 38px; font-size: 15px; }
.tag-sugg { margin-top: 8px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
.tag-sugg::-webkit-scrollbar { display: none; }
.sugg-ico { color: var(--ink-3); display: inline-grid; place-items: center; flex: 0 0 auto; }
.sugg-ico svg { width: 18px; height: 18px; }
.chip-btn.mini { flex: 0 0 auto; padding: 2px 10px; font-size: 13.5px; }
.list-pick { height: 36px; font-size: 14.5px; }
.sugg-label { font-size: 12px; color: var(--ink-3); }
/* recall */
.recall { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 8px 10px 10px 14px; margin-bottom: 12px; }
.recall-head { display: flex; align-items: center; gap: 4px; }
.recall-label { font-size: 12px; font-weight: 700; color: var(--accent-ink); letter-spacing: .04em; }
.recall-btn { border: 0; background: none; color: var(--ink-3); font-size: 12.5px; padding: 4px 8px; border-radius: 8px; }
.recall-btn:hover { background: var(--surface-2); color: var(--ink); }
.recall-body { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 0; color: inherit; }
.recall-title { display: block; font-family: var(--font-title); font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.recall-text { display: block; font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
/* dates */
.dates .upd { color: var(--ink-3); }
/* selection mode */
.memo-card.selecting { position: relative; padding-left: 48px; }
.pick-box { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--ink-3); display: grid; place-items: center; font-size: 14px; font-weight: 700; color: var(--surface); }
.memo-card.picked { border-color: var(--accent); background: var(--accent-soft); }
.memo-card.picked .pick-box { background: var(--accent); border-color: var(--accent); }
.memo-list.with-bar { padding-bottom: 90px; }
.select-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--sel-bar, var(--surface)); border-top: 1px solid var(--line); box-shadow: var(--shadow); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.select-bar-in { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sel-count { font-size: 14px; }
.btn.danger-solid { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn.sel-start { padding: 2px 10px; font-size: 13px; color: var(--accent-ink); }
/* search panel */
.search-toggle { position: relative; }
.search-toggle svg { width: 21px; height: 21px; }
.search-toggle[aria-expanded="true"] { background: var(--accent-soft); color: var(--accent-ink); }
.search-toggle .dot { position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: none; }
.search-toggle.active .dot { display: block; }
.search-panel { padding-top: 6px; }
.hist-row { display: flex; align-items: center; gap: 6px; margin-top: 8px; min-width: 0; }
.hist-chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.hist-chips::-webkit-scrollbar { display: none; }

/* ---------- view screen ---------- */

body.editing-body .edit-actions { display: none; }
.pop { position: fixed; z-index: 70; overflow: auto; max-width: calc(100vw - 16px); }
.pop-cap { font-size: 12px; font-weight: 700; color: var(--ink-3); margin-bottom: 6px; }
.head-pick { display: grid; gap: 2px; min-width: 160px; }
.head-pick button { text-align: left; border: 0; background: none; padding: 6px 10px; border-radius: 8px; color: var(--ink); }
.head-pick button:hover { background: var(--surface-2); }
.head-pick .hp-h2 { font-size: 20px; font-weight: 700; } .head-pick .hp-h3 { font-size: 17px; font-weight: 700; } .head-pick .hp-h4 { font-size: 15px; font-weight: 700; color: var(--ink-2); }
/* text colors & markers (theme aware) */
.tc-default { color: var(--ink); } .tc-rose { color: var(--tc-rose); } .tc-orange { color: var(--tc-orange); } .tc-green { color: var(--tc-green); }
.tc-blue { color: var(--tc-blue); } .tc-purple { color: var(--tc-purple); } .tc-gray { color: var(--tc-gray); } .tc-brown { color: var(--tc-brown); }
.hl-none { background: transparent; } .hl-yellow, .hl-pink, .hl-green, .hl-blue, .hl-purple { border-radius: 3px; padding: 0 1px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.hl-yellow { background: var(--hl-yellow); } .hl-pink { background: var(--hl-pink); } .hl-green { background: var(--hl-green); } .hl-blue { background: var(--hl-blue); } .hl-purple { background: var(--hl-purple); }
/* headings in body */
.view-body h2, .editor h2 { font-size: 1.35em; line-height: 1.45; margin: 1.1em 0 .4em; padding-bottom: .2em; border-bottom: 1px solid var(--line); }
.view-body h3, .editor h3 { font-size: 1.17em; line-height: 1.5; margin: 1em 0 .35em; }
.view-body h4, .editor h4 { font-size: 1em; line-height: 1.6; margin: .9em 0 .3em; color: var(--ink-2); }
.view-body > :first-child, .editor > :first-child { margin-top: 0; }
.fmt-bar .sep { width: 1px; background: var(--line); margin: 6px 4px; }
.editor { min-height: 240px; padding: 14px 16px; font-size: 16px; line-height: 1.8; letter-spacing: .02em; outline: none; overflow-wrap: anywhere; }
.editor:empty::before { content: attr(data-placeholder); color: var(--ink-3); }
.pop { position: fixed; z-index: 70; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 10px; }

.drop { border-radius: var(--radius); }

.uploading { font-size: 12.5px; color: var(--ink-3); margin-top: 6px; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 2px; background: var(--surface-2); border-radius: 999px; padding: 2px 4px 2px 11px; font-size: 13px; max-width: 100%; }
.chip .tx { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip button { border: 0; background: none; color: var(--ink-3); width: 22px; height: 22px; border-radius: 50%; flex: 0 0 auto; }
.chip.on { background: var(--accent-soft); color: var(--accent-ink); }
.list-toggle { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 12px; font-size: 13px; color: var(--ink-2); }

.edit-actions { position: sticky; bottom: 0; background: var(--bar-edit); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 10; }

/* ---------- overlays ---------- */
.toast-host { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 100; pointer-events: none; padding-inline: 16px; }
.toast { background: var(--ok); color: var(--ok-ink); border-radius: 999px; padding: 8px 18px; font-weight: 700; font-size: 14px; box-shadow: var(--shadow); animation: toastLife 3s ease forwards; max-width: 100%; }
.toast.ng { background: var(--ng); color: var(--ng-ink); }
@keyframes toastLife { 0% { opacity: 0; transform: translateY(-8px); } 8% { opacity: 1; transform: none; } 70% { opacity: 1; } 100% { opacity: 0; } }
.modal-scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 90; display: grid; place-items: center; padding: 16px; }

.modal p { margin: 0 0 16px; color: var(--ink-2); font-size: 14px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.picker-list { overflow: auto; display: grid; gap: 6px; margin-block: 10px; min-height: 0; flex: 1; }
.lightbox { position: fixed; inset: 0; z-index: 95; background: rgba(10,10,14,.9); display: grid; place-items: center; padding: 16px; }
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; cursor: zoom-in; }
.lightbox.actual { display: block; overflow: auto; padding: 56px 0 40px; }
.lightbox.actual img { max-width: none; max-height: none; cursor: zoom-out; border-radius: 0; }
.lb-hint { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); color: #fff; background: rgba(255,255,255,.14); border-radius: 999px; padding: 4px 14px; font-size: 12.5px; white-space: nowrap; pointer-events: none; }
.lightbox button { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 10px); right: 12px; background: rgba(255,255,255,.15); color: #fff; border: 0; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; }

@media (prefers-reduced-motion: reduce) {
  .toast { animation: toastFade 3s steps(1) forwards; }
  @keyframes toastFade { 0% { opacity: 1; } 100% { opacity: 0; } }
  * { transition: none !important; }
}
@media (max-width: 420px) {
  /* スマホ幅でも書式ボタンが1行に収まるよう詰める */

}

}
/* ---------- 情報まとめ（1つの新しいメモとして読める、すっきりした構成） ---------- */

<body>

<script>
(() => {
"use strict";

/* =========================================================
   Utilities
   ========================================================= */
const $ = (sel, root = document) => root.querySelector(sel);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v === true ? "" : v);

    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }

};
const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const GENRES = ["体験", "学び", "アイデア"];
const fmtDate = (ms) => {
  const d = new Date(ms);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};
const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };
/* 小さなアイコン（文字の代わりに使い、画面の情報量を減らす） */
const ICONS = {
  note: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/>',
  tag: '<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/>',

  select: '<rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8.5 12 2.5 2.5 4.5-5"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>',

  gear: '<circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/>',
  more: '<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
  share: '<circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.4M8.2 13.2l7.6 4.4"/>',
};
const iconBtn = (name, label, onclick, cls) => h("button", { class: "icon-btn ico" + (cls ? " " + cls : ""), type: "button", "aria-label": label, title: label, onclick }, svgIcon(ICONS[name]));
const svgIcon = (d) => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor"); s.setAttribute("stroke-width", "2"); s.setAttribute("stroke-linecap", "round"); s.innerHTML = d; return s; };

/* =========================================================
   HTML sanitizer for rich-text body
   ========================================================= */
const OK_TAGS = new Set(["B","STRONG","I","EM","S","STRIKE","DEL","U","SPAN","FONT","A","BR","DIV","P","IMG","UL","OL","LI","BLOCKQUOTE","H2","H3","H4"]);
const COLOR_CLASS = /^(tc-(default|rose|orange|green|blue|purple|gray|brown)|hl-(none|yellow|pink|green|blue|purple))$/;
/* 以前の版で保存した文字色（色コード）を、テーマ対応の色の種類に置き換える */
const LEGACY_TC = { "#d0637a": "rose", "#d98a3d": "orange", "#4e9e78": "green", "#4f86c6": "blue", "#8e6cc4": "purple", "#8a8fa3": "gray", "#a0705a": "brown" };
const toHex = (c) => { c = (c || "").trim().toLowerCase(); if (c.startsWith("#")) return c; const m = c.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/); return m ? "#" + [m[1], m[2], m[3]].map(x => (+x).toString(16).padStart(2, "0")).join("") : c; };
const okColor = (c) => /^(#[0-9a-f]{3,8}|rgba?\([\d\s.,%]+\))$/i.test((c || "").trim());
function sanitize(html) {
  const tpl = document.createElement("template");
  tpl.innerHTML = html || "";
  const walk = (node) => {
    for (const child of [...node.childNodes]) {
      if (child.nodeType === 3) continue;
      if (child.nodeType !== 1) { child.remove(); continue; }
      if (!OK_TAGS.has(child.tagName)) {
        if (["SCRIPT","STYLE","IFRAME","OBJECT","EMBED"].includes(child.tagName)) { child.remove(); continue; }
        walk(child); child.replaceWith(...child.childNodes); continue;
      }
      const keep = {};
      if (child.tagName === "A") {
        const href = child.getAttribute("href") || "";
        if (/^(https?:|mailto:)/i.test(href)) keep.href = href;
        if (child.dataset.att) keep["data-att"] = child.dataset.att;
      }
      if (child.tagName === "IMG") {
        if (child.dataset.att) keep["data-att"] = child.dataset.att;
        else { const s = child.getAttribute("src") || ""; if (/^https?:/i.test(s)) keep.src = s; }
        keep.alt = child.getAttribute("alt") || "";
        const w = (child.style && child.style.width) || "";
        if (/^\d{1,3}(\.\d+)?%$/.test(w) && parseFloat(w) > 0 && parseFloat(w) <= 100) keep.style = "width:" + w;
      }
      if (["SPAN", "B", "STRONG", "I", "EM", "S", "STRIKE", "DEL", "U"].includes(child.tagName) && child.style && child.getAttribute("style")) {
        // スタイルで付いた太字・斜体・取り消し線・下線をタグに置き換える
        const st = child.style, wraps = [];
        if (st.fontWeight === "bold" || parseInt(st.fontWeight, 10) >= 600) wraps.push("B");
        if (st.fontStyle === "italic") wraps.push("I");
        const deco = (st.textDecorationLine || st.textDecoration || "");
        if (deco.includes("line-through")) wraps.push("S");
        if (deco.includes("underline")) wraps.push("U");
        for (const t of wraps) { const w = document.createElement(t); while (child.firstChild) w.append(child.firstChild); child.append(w); }
      }
      if (child.tagName === "SPAN" || child.tagName === "FONT") {
        const cls = [...(child.classList || [])].filter(c => COLOR_CLASS.test(c));
        const legacy = LEGACY_TC[toHex(child.getAttribute("color") || (child.style && child.style.color) || "")];
        if (legacy && !cls.some(c => c.startsWith("tc-"))) cls.push("tc-" + legacy);
        if (cls.length) keep.class = cls.join(" ");
      }
      for (const a of [...child.attributes]) child.removeAttribute(a.name);
      for (const [k, v] of Object.entries(keep)) child.setAttribute(k, v);
      if (child.tagName === "IMG" && !keep.src && !keep["data-att"]) { child.remove(); continue; }
      if (child.tagName === "FONT") { const sp = document.createElement("span"); if (keep.class) sp.className = keep.class; while (child.firstChild) sp.append(child.firstChild); child.replaceWith(sp); walk(sp); if (!sp.className) sp.replaceWith(...sp.childNodes); continue; }
      if (child.tagName === "SPAN" && !keep.class) { walk(child); child.replaceWith(...child.childNodes); continue; }
      walk(child);
      // 中身のない書式（太字だけ残った空要素など）は取り除く
      if (["B", "STRONG", "I", "EM", "S", "STRIKE", "DEL", "U", "SPAN", "A"].includes(child.tagName) && !child.textContent.replace(/\u200B/g, "") && !child.querySelector("img, br")) child.remove();
    }

}
const htmlToText = (html) => { html = (html || "").replace(/\u200B/g, ""); const t = document.createElement("template"); t.innerHTML = (html || "").replace(/<(br|\/p|\/div|\/li|\/h[2-4])>/gi, "\n$&"); return (t.content.textContent || "").replace(/\n{3,}/g, "\n\n").trim(); };

/* =========================================================
   Storage: IndexedDB on this device (works offline)
   stores: memos, lists, meta, files (attachment blobs)
   ========================================================= */
const Storage = {
  mode: "idb", idb: null,
  init() {
    return new Promise((resolve) => {
      let req;
      try { req = indexedDB.open("sosaku-memo", 1); } catch { this.mode = "memory"; return resolve(); }
      req.onupgradeneeded = () => {
        const db = req.result;
        for (const s of ["memos", "lists", "meta", "files"]) if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: s === "meta" ? "key" : "id" });
      };
      req.onsuccess = () => { this.idb = req.result; resolve(); };
      req.onerror = () => { this.mode = "memory"; resolve(); };
    });
  },
  _tx(store, mode, fn) {
    if (!this.idb) return Promise.resolve(store === "meta" ? undefined : []);
    return new Promise((resolve, reject) => {
      const tx = this.idb.transaction(store, mode);
      const os = tx.objectStore(store);
      let out;
      const r = fn(os);
      if (r) r.onsuccess = () => { out = r.result; };
      tx.oncomplete = () => resolve(out);
      tx.onerror = () => reject({ code: tx.error && tx.error.name === "QuotaExceededError" ? "quota_exceeded" : "write_failed", message: String(tx.error) });
      tx.onabort = () => reject({ code: tx.error && tx.error.name === "QuotaExceededError" ? "quota_exceeded" : "write_failed", message: String(tx.error) });
    });
  },
  async loadAll() {
    const [memos, lists, meta] = await Promise.all([
      this._tx("memos", "readonly", os => os.getAll()),
      this._tx("lists", "readonly", os => os.getAll()),
      this._tx("meta", "readonly", os => os.get("app")),
    ]);
    return { memos: memos || [], lists: lists || [], meta: meta ? meta.value : {} };
  },
  putMemo(m) { return this._tx("memos", "readwrite", os => os.put(m)); },
  delMemo(id) { return this._tx("memos", "readwrite", os => os.delete(id)); },
  putList(l) { return this._tx("lists", "readwrite", os => os.put(l)); },
  delList(id) { return this._tx("lists", "readwrite", os => os.delete(id)); },
  putMeta(meta) { return this._tx("meta", "readwrite", os => os.put({ key: "app", value: JSON.parse(JSON.stringify(meta)) })); },
  putFile(rec) { return this._tx("files", "readwrite", os => os.put(rec)); },
  getFile(id) { return this._tx("files", "readonly", os => os.get(id)); },
  delFile(id) { return this._tx("files", "readwrite", os => os.delete(id)); },
  allFileIds() { return this._tx("files", "readonly", os => os.getAllKeys()); },
  allFiles() { return this._tx("files", "readonly", os => os.getAll()); },
};

/* attachment blob → object URL cache */
const FileUrls = new Map();
async function ensureFileUrls(atts) {
  let loaded = false;
  for (const a of atts || []) {
    if (!a.fileId || FileUrls.has(a.fileId)) continue;
    const rec = await Storage.getFile(a.fileId).catch(() => null);
    FileUrls.set(a.fileId, rec && rec.blob ? URL.createObjectURL(rec.blob) : "");
    loaded = true;
  }
  return loaded;
}

/* =========================================================
   メモ管理機能 (Manager): in-memory index + persistence
   ========================================================= */
const Manager = {
  memos: new Map(), lists: new Map(), meta: { history: [] }, sorted: [],
  async load() {
    const { memos, lists, meta } = await Storage.loadAll();
    this.memos = new Map(memos.map(m => [m.id, normalizeMemo(m)]));
    this.lists = new Map(lists.map(l => [l.id, l]));
    this.meta = { history: [], ...meta };
    this.reindex();
  },
  reindex() {
    this.sorted = [...this.memos.values()].sort((a, b) => b.updatedAt - a.updatedAt);
    for (const m of this.sorted) m._search = [m.title, m.bodyText, (m.genres || []).join(" "), listNames(m).join(" "), (m.tags || []).map(t => "#" + t).join(" "), (m.attachments || []).map(a => a.name).join(" ")].join("\n").toLowerCase();
    // 階層（親子）の索引
    this.kids = new Map(); this.roots = [];
    for (const m of this.sorted) {
      const p = this.effParent(m);
      if (p) { if (!this.kids.has(p)) this.kids.set(p, []); this.kids.get(p).push(m); } else this.roots.push(m);
    }
  },
  /* 親が存在しない・循環している場合は最上位として扱う */
  effParent(m) {
    if (!m.parentId || !this.memos.has(m.parentId) || m.parentId === m.id) return null;
    const seen = new Set([m.id]); let cur = this.memos.get(m.parentId);
    while (cur) { if (seen.has(cur.id)) return null; seen.add(cur.id); if (!cur.parentId) break; cur = this.memos.get(cur.parentId); }
    return m.parentId;
  },
  ancestors(id) {
    const out = []; let m = this.memos.get(id); const seen = new Set();
    while (m && this.effParent(m) && !seen.has(m.id)) { seen.add(m.id); m = this.memos.get(m.parentId); out.unshift(m); }
    return out;
  },
  childrenOf(id, sort) { return sortMemos(this.kids.get(id) || [], sort || "upd-desc"); },
  descendantIds(id) {
    const out = new Set(); const stack = [id];
    while (stack.length) { const x = stack.pop(); for (const c of this.kids.get(x) || []) if (!out.has(c.id)) { out.add(c.id); stack.push(c.id); } }
    return out;
  },
  /* 以前の「参照メモ」を親子関係に移す（一度だけ）: メモAがBを参照していたら、BをAの子にする */
  async migrateTree() {
    if (this.meta.treeMigrated) return;
    const byCreated = [...this.memos.values()].sort((a, b) => a.createdAt - b.createdAt);
    const changed = new Set();
    for (const a of byCreated) for (const bid of a.links || []) {
      const b = this.memos.get(bid);
      if (!b || b.id === a.id || b.parentId) continue;
      this.reindex();
      if (this.ancestors(a.id).some(x => x.id === b.id)) continue;
      b.parentId = a.id; changed.add(b);
    }
    for (const m of changed) await Storage.putMemo(stripRuntime(m)).catch(() => {});
    this.meta.treeMigrated = true; await Storage.putMeta(this.meta).catch(() => {});
    this.reindex();
  },
  get(id) { return this.memos.get(id) || null; },
  /* 保存依頼 */
  async saveMemo(draft) {
    const now = Date.now();
    const prev = this.memos.get(draft.id);
    const memo = normalizeMemo({ ...draft, createdAt: prev ? prev.createdAt : now, updatedAt: now });
    const touchedLists = new Set([...(memo.listIds || []), ...((prev && prev.listIds) || [])]);
    this.memos.set(memo.id, memo);
    for (const lid of touchedLists) { const l = this.lists.get(lid); if (l) l.updatedAt = now; }
    try {
      await Storage.putMemo(stripRuntime(memo));
      await Promise.all([...touchedLists].map(lid => this.lists.get(lid) && Storage.putList(this.lists.get(lid))));
    } catch (e) {
      if (prev) this.memos.set(prev.id, prev); else this.memos.delete(memo.id);
      this.reindex();
      throw e;
    }
    this.reindex(); afterChange();
    return memo;
  },
  /* 削除依頼 */
  async deleteMemo(id) {
    const prev = this.memos.get(id);
    if (!prev) return;
    const now = Date.now();
    this.memos.delete(id);
    try {
      await Storage.delMemo(id);
      for (const lid of prev.listIds || []) { const l = this.lists.get(lid); if (l) { l.updatedAt = now; await Storage.putList(l); } }
    } catch (e) { this.memos.set(id, prev); this.reindex(); throw e; }
    // 参照されていたリンクを外し、子メモはひとつ上の階層へ移す
    for (const m of this.memos.values()) {
      let ch = false;
      if ((m.links || []).includes(id)) { m.links = m.links.filter(x => x !== id); ch = true; }
      if (m.parentId === id) { m.parentId = (prev.parentId && this.memos.has(prev.parentId)) ? prev.parentId : null; ch = true; }
      if (ch) Storage.putMemo(stripRuntime(m)).catch(() => {});
    }

    this.meta.deleted = { ...(this.meta.deleted || {}), [id]: now }; Storage.putMeta(this.meta).catch(() => {});
    this.reindex(); afterChange();
  },
  async saveList(list) {
    const now = Date.now();
    const l = { createdAt: now, ...list, updatedAt: now };
    const prev = this.lists.get(l.id);
    this.lists.set(l.id, l);
    try { await Storage.putList(l); } catch (e) { if (prev) this.lists.set(prev.id, prev); else this.lists.delete(l.id); throw e; }
    this.reindex(); afterChange();
    return l;
  },
  /* リストに入れるメモをまとめて更新 */
  async setListMembers(listId, memoIds) {
    const want = new Set(memoIds);
    const changed = [];
    for (const m of this.memos.values()) {
      const has = (m.listIds || []).includes(listId);
      if (has === want.has(m.id)) continue;
      m.listIds = has ? m.listIds.filter(x => x !== listId) : [...(m.listIds || []), listId];
      changed.push(m);
    }
    if (!changed.length) return 0;
    const l = this.lists.get(listId); if (l) { l.updatedAt = Date.now(); await Storage.putList(l); }
    // リストの出入りはメモ側の情報なので、同期で新しい方が勝つよう更新日時も進める
    const now = Date.now(); for (const m of changed) { m.updatedAt = Math.max(m.updatedAt, now); await Storage.putMemo(stripRuntime(m)); }
    this.reindex(); afterChange();
    return changed.length;
  },
  async deleteList(id) {
    const prev = this.lists.get(id);
    this.lists.delete(id);
    try { await Storage.delList(id); } catch (e) { if (prev) this.lists.set(id, prev); throw e; }
    for (const m of this.memos.values()) {
      if ((m.listIds || []).includes(id)) { m.listIds = m.listIds.filter(x => x !== id); Storage.putMemo(stripRuntime(m)).catch(() => {}); }
    }
    this.meta.deletedLists = { ...(this.meta.deletedLists || {}), [id]: Date.now() }; Storage.putMeta(this.meta).catch(() => {});
    this.reindex(); afterChange();
  },
  async pushHistory(q) {
    q = q.trim(); if (!q) return;
    // 検索履歴は直近3件だけ残す（4件目以降は自動で消える）
    this.meta.history = [q, ...(this.meta.history || []).filter(x => x !== q)].slice(0, 3);

async function shrinkImage(file, maxSide, quality) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });

    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(res, "image/jpeg", quality));
  } finally { URL.revokeObjectURL(url); }
}

  let blob = file;
  // スマホ写真など大きなJPEGは長辺2400pxに縮小して容量を節約
  if (/^image\/jpe?g$/.test(base.type) && file.size > 2.5 * 1024 * 1024) {
    try { const small = await shrinkImage(file, 2400, 0.85); if (small && small.size < file.size) { blob = small; base.size = small.size; } } catch {}
  }
  const fileId = uid("f");
  try { await Storage.putFile({ id: fileId, blob, name: base.name, type: base.type, createdAt: Date.now() }); }
  catch (e) { throw new Error(e && e.code === "quota_exceeded" ? "端末の空き容量が足りないため添付できませんでした" : `${base.name} を添付できませんでした`); }

  return { ...base, fileId };

      // 原因を探れるよう、どの段階で・どこが・何と返したか（Google の画面の題名）を添える
      const body = await res.text().catch(() => "");
      const title = ((/<title>([^<]*)<\/title>/i.exec(body) || [])[1] || "").trim().slice(0, 60);
      let where = ""; try { where = new URL(res.url).hostname.replace(/^script\./, ""); } catch {}
      const info = `（${res.status}・${SYNC_STEP[action] || action}${where ? "・" + where : ""}${title ? "・" + title : ""}）`;
      // 接続先のプログラムは動いたが、Google の「返事の受け取り口」（googleusercontent.com）で失敗した、
      // または同じ同期の中で、ついさっきまで同じURLとつながっていた（＝URLは正しい）。
      // Google 側の一時的な不調なので、少し待ってやり直す（どの操作も、やり直しても二重にならない作り）
      if (/googleusercontent/.test(where) || this.reached) {
        if (tries > 1) { await new Promise(r => setTimeout(r, 2000)); return this.call(action, extra, tries - 1); }
        const err = new Error("Googleからの返事を受け取れませんでした" + info + "。Google側の一時的な不調です。少したってから自動でやり直します");
        err.transient = true; throw err;
      }
      throw new Error(res.status === 404
        ? "接続先が見つかりません" + info + "。Apps Script の「デプロイを管理」で、このURLの公開が残っているか（アーカイブしていないか）確かめてください"
        : "接続先でエラーが起きました" + info);
    }
    const text = await res.text();
    let j; try { j = JSON.parse(text); } catch {
      // Google 側のエラー画面が返ってきたときは、原因ごとに直し方を示す
      if (/doPost/.test(text)) throw new Error("接続先のプログラムが古いままです。Apps Script でコードを貼り付けて保存したあと、「デプロイ」→「デプロイを管理」→ 鉛筆 →「新しいバージョン」で公開し直してください");
      if (/accounts\.google\.com|ログイン|Sign in/i.test(text)) throw new Error("公開の設定で「アクセスできるユーザー」が「全員」になっていません");
      throw new Error("接続先の応答を読めませんでした（URLを確かめてください）");
    }
    if (!j.ok) throw new Error(j.error === "auth" ? "合言葉が違います"
      : j.error === "nokey" ? "接続先のプログラムで合言葉（KEY）がまだ設定されていません。書き換えて保存し、新しいバージョンで公開し直してください"
      : (j.error || "エラー"));
    this.reached = true;
    return j;
  },
  /* 一時的な失敗のあとは、1分後に自動でやり直す（続けて3回まで。成功したら数え直す） */
  retries: 0, RETRY_DELAY: 60000,
  retryLater() { if (this.retries >= 3) return; this.retries++; this.schedule(this.RETRY_DELAY); },
  schedule(delay = 4000) { if (!this.ready()) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), delay); },
  async run(force) {
    if (!this.ready()) return false;
    if (this.busy) { this.again = true; return false; }
    if (!navigator.onLine) { this.status = "電波がないため、つながったら同期します"; this.notify(); return false; }
    this.busy = true; this.error = ""; this.status = "同期しています…"; this.notify();
    this.reached = false;
    try {
      const ver = (await this.call("ping")).version || 1;
      if (ver < 2) throw new Error("接続先のプログラムが古いままです。最新の gas/Code.gs を貼り付けて保存し、「デプロイを管理」→ 鉛筆 →「新しいバージョン」で公開し直してください");
      const remote = (await this.call("pull")).data || {};
      const changed = await this.merge(remote);
      // メモ・リストのデータを先に保存する（添付ファイルの途中で失敗しても、メモ本体はドライブに残るように）
      await this.call("push", { data: this.snapshot() });
      Manager.meta.lastSync = Date.now(); await Storage.putMeta(Manager.meta).catch(() => {});
      const failed = await this.syncFiles(force);
      this.status = "";
      if (failed) { this.error = `メモは同期しましたが、添付ファイル${failed}件を送受信できませんでした（${this.fileError || "通信が途中で切れました"}）。少したってから自動で続きを送ります`; this.retryLater(); }
      else this.retries = 0;
      // ドライブ側から増えた・変わったメモを画面に反映（メモを書いている途中の画面は作り直さない）
      if (changed) { const n = current().name; if (n === "search" || n === "list" || n === "view") render(); }
      return !failed;
    } catch (e) {
      this.error = (e && e.message) || "同期できませんでした";
      if (e && e.transient) this.retryLater();
      return false;
    } finally {
      this.busy = false; this.notify();
      if (this.again) { this.again = false; this.schedule(1000); }
    }
  },
  snapshot() {
    return { app: "hifumiyo", version: 1, savedAt: Date.now(),
      memos: [...Manager.memos.values()].map(stripRuntime), lists: [...Manager.lists.values()],
      deleted: Manager.meta.deleted || {}, deletedLists: Manager.meta.deletedLists || {} };
  },
  /* ドライブ側と合わせる（新しい方を残す。削除の記録がそのデータより新しければ消す）。端末側が変わったら true */
  async merge(remote) {
    const meta = Manager.meta;
    const maxMap = (a, b) => { const o = { ...(a || {}) }; for (const [k, t] of Object.entries(b || {})) if (!(o[k] >= t)) o[k] = t; return o; };
    meta.deleted = maxMap(meta.deleted, remote.deleted);
    meta.deletedLists = maxMap(meta.deletedLists, remote.deletedLists);
    let changed = false;
    const apply = async (localMap, remoteArr, tomb, put, del) => {
      const remoteMap = new Map((remoteArr || []).map(x => [x.id, x]));
      const ids = new Set([...localMap.keys(), ...remoteMap.keys()]);
      for (const id of ids) {
        const l = localMap.get(id), r = remoteMap.get(id);
        const win = !l ? r : !r ? l : ((r.updatedAt || 0) > (l.updatedAt || 0) ? r : l);
        if (tomb[id] && tomb[id] >= (win.updatedAt || 0)) { if (l) { await del(id); changed = true; } continue; }
        if (win !== l) { await put(win); changed = true; }
      }
    };
    await apply(Manager.memos, remote.memos, meta.deleted, (m) => Storage.putMemo(stripRuntime(normalizeMemo(m))), (id) => Storage.delMemo(id));
    await apply(Manager.lists, remote.lists, meta.deletedLists, (l) => Storage.putList(l), (id) => Storage.delList(id));
    await Storage.putMeta(meta);
    if (changed) await Manager.load();
    return changed;
  },
  /* 添付ファイルを足りない側へ送る。大きなファイルも送れるよう小分け（約0.5MBずつ）にする。
     1つ失敗しても残りは続け、失敗した件数を返す（次の同期で続きから） */
  CHUNK: 700000,
  async syncFiles(force) {
    const need = new Map();
    for (const m of Manager.memos.values()) for (const a of m.attachments || []) if (a.fileId) need.set(a.fileId, a);
    if (!need.size) return 0;
    const meta = Manager.meta;
    const localIds = new Set(await Storage.allFileIds());
    // ドライブにあると確かめ済みの添付だけなら、問い合わせを省く（通信の回数を減らす）。
    // ただし「同期」を押したときと、前回の確かめから1日たったときは、ドライブ側を確かめ直す
    const known = new Set(meta.driveFiles || []);
    const fresh = Date.now() - (meta.driveFilesAt || 0) < 864e5;
    if (!force && fresh && [...need.keys()].every(id => localIds.has(id) && known.has(id))) return 0;
    const remoteIds = new Set((await this.call("listFiles")).ids || []);
    const saveKnown = () => { meta.driveFiles = [...need.keys()].filter(id => remoteIds.has(id)); return Storage.putMeta(meta).catch(() => {}); };
    meta.driveFilesAt = Date.now(); await saveKnown();
    const todo = [...need].filter(([id]) => localIds.has(id) !== remoteIds.has(id));
    let n = 0, failed = 0; this.fileError = "";
    for (const [id, a] of todo) {
      n++;
      try {
        if (localIds.has(id)) {
          const rec = await Storage.getFile(id); if (!rec || !rec.blob) continue;
          const data = (await blobToDataUrl(rec.blob)).split(",")[1] || "";
          const total = Math.max(1, Math.ceil(data.length / this.CHUNK));
          for (let i = 0; i < total; i++) {
            this.status = `添付ファイルを送っています（${n}/${todo.length}${total > 1 ? `・${Math.round((i + 1) / total * 100)}%` : ""}）…`; this.notify();
            await this.call("putChunk", { id, type: rec.type || a.type, index: i, total, data: data.slice(i * this.CHUNK, (i + 1) * this.CHUNK) });
          }
          remoteIds.add(id); await saveKnown();
        } else {
          let b64 = "", type = a.type, total = Infinity;
          while (b64.length < total) {
            this.status = `添付ファイルを受け取っています（${n}/${todo.length}${isFinite(total) && total > this.CHUNK ? `・${Math.round(b64.length / total * 100)}%` : ""}）…`; this.notify();
            const r = await this.call("getChunk", { id, offset: b64.length, length: this.CHUNK });
            total = r.total || 0; type = r.type || type; b64 += r.data || "";
            if (!r.data) break;
          }
          const bin = atob(b64); const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          await Storage.putFile({ id, blob: new Blob([bytes], { type }), name: a.name, type: a.type, createdAt: Date.now() });
        }
      } catch (e) { failed++; this.fileError = (e && e.message) || ""; }
    }
    return failed;
  },
};
window.addEventListener("online", () => { if (Sync.ready()) Sync.schedule(500); });
/* スマホでアプリを画面に戻したとき（裏で開いたままだった場合も）、同期がオンのときだけドライブから取り込む。
   短い間に何度も切り替えたときは、前回の同期から20秒たつまで待つ */
let lastResumeSync = 0;
const resumeSync = () => {
  if (document.visibilityState !== "visible" || !Sync.ready()) return;
  if (Date.now() - lastResumeSync < 20000) return;
  lastResumeSync = Date.now(); Sync.schedule(300);
};
document.addEventListener("visibilitychange", resumeSync);
window.addEventListener("pageshow", (e) => { if (e.persisted) resumeSync(); });
/* メモ・リストを変えたら（同期がオンのときだけ）少し待ってから送る */
function afterChange() { Sync.schedule(); }

/* =========================================================
   設定 (バックアップ)
   ========================================================= */
function openSettings() {
  modal({ wide: true, title: "設定", body: (close) => {
    // 書き出したら、その場で「前回の書き出し」を更新する（連打で二重に書き出さないよう、終わるまでボタンを止める）
    const lastText = () => "前回の書き出し：" + (Manager.meta.lastBackup ? fmtDate(Manager.meta.lastBackup) : "まだありません");
    const lastEl = h("p", { class: "ai-hint", style: "margin:0" }, lastText());
    const expBtn = h("button", { class: "btn", type: "button", onclick: async () => {
      expBtn.disabled = true;
      try { await exportBackup(); } finally { expBtn.disabled = false; lastEl.textContent = lastText(); }
    } }, "バックアップを書き出す");
    const impIn = h("input", { id: "importfile", type: "file", accept: "application/json,.json", hidden: true, onchange: async (e) => { const f = e.target.files[0]; e.target.value = ""; if (f) { close(true); await importBackup(f); } } });
    return h("div", { style: "overflow:auto;min-height:0" },
      h("div", { class: "settings-sec", style: "border-top:0;margin-top:0;padding-top:0" },
        h("h4", {}, "表示"),
        h("div", { class: "row" }, h("span", { style: "flex:1" }, "ダークモード"), themeSwitch())),
      syncSection(),
      h("div", { class: "settings-sec" },
        h("h4", {}, "バックアップ"),
        h("p", { class: "ai-hint", style: "margin:0" }, "同期を使わない場合は、ときどき書き出しておいてください（iPhoneはホーム画面から削除するとメモも消えます）。"),
        lastEl,
        (() => { const el = h("p", { class: "ai-hint", style: "margin:0" }, "端末内の保存の保護：確認中…");
          (async () => { try { const ok = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : false;
            el.textContent = "端末内の保存の保護：" + (ok ? "有効（空き容量が少なくなっても自動で消されません）" : "未設定（ホーム画面に追加したアプリから開くと有効になりやすくなります）"); } catch { el.textContent = "端末内の保存の保護：確認できませんでした"; } })();
          return el; })(),
        h("div", { class: "row" },
          expBtn,
          h("button", { class: "btn", type: "button", onclick: () => impIn.click() }, "バックアップを読み込む"), impIn)),
      h("div", { class: "modal-actions", style: "margin-top:16px" }, h("button", { class: "btn", type: "button", onclick: () => close(null) }, "閉じる")));
  } });
}
/* 設定の「Googleドライブ同期」: 「同期」ボタンで オン／オフ（押すまで状態を保つ）。接続先と合言葉はこの端末に保存 */
const SYNC_HELP = "https://github.com/kokoharu1108/sosaku-memo/blob/main/docs/Googleドライブ同期の設定.md";
function syncSection() {
  const urlIn = h("input", { id: "sync-url", class: "text-input", type: "url", inputmode: "url", autocomplete: "off", spellcheck: "false", placeholder: "https://script.google.com/…/exec", value: Sync.url() });
  const keyIn = h("input", { id: "sync-key", class: "text-input", type: "password", autocomplete: "off", placeholder: "合言葉", value: Sync.key() });
  const statusEl = h("p", { class: "ai-hint sync-status", style: "margin:0" });
  const btn = h("button", { class: "btn sync-btn", type: "button", onclick: async () => {
    if (Sync.on()) { lsSet("sm.syncOn", false); Sync.error = ""; Sync.status = ""; toast("同期をオフにしました"); draw(); return; }
    const url = normalizeSyncUrl(urlIn.value), key = keyIn.value.trim();
    urlIn.value = url;
    if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) { toast("接続先のURL（https://script.google.com/… で始まるもの）を入れてください", true); urlIn.focus(); return; }
    if (/\/dev$/.test(url)) { toast("これはテスト用のURL（/dev）です。「新しいデプロイ」の完了画面に出る /exec で終わるURLを入れてください", true); urlIn.focus(); return; }
    if (!key) { toast("合言葉を入れてください", true); keyIn.focus(); return; }
    lsSet("sm.syncUrl", url); lsSet("sm.syncKey", key); lsSet("sm.syncOn", true);
    draw();
    Sync.retries = 0;
    const ok = await Sync.run(true);
    toast(ok ? "同期しました" : syncErrText(Sync.error || Sync.status), !ok);
  } }, svgIcon(ICONS.sync), h("span", {}, "同期"));
  const setup = h("details", { class: "sync-setup" }, h("summary", {}, "接続の設定"),
    h("div", { class: "sync-fields" },
      h("label", { for: "sync-url" }, "接続先のURL"), urlIn,
      h("label", { for: "sync-key" }, "合言葉"), keyIn,
      h("a", { href: SYNC_HELP, target: "_blank", rel: "noopener" }, "設定のしかた（最初に1回だけ）")));
  let mounted = false;
  const draw = () => {
    if (mounted && !btn.isConnected) { Sync.listeners.delete(draw); return; }   // 設定を閉じたら更新をやめる
    const on = Sync.on();
    btn.setAttribute("aria-pressed", String(on));
    btn.lastChild.textContent = on ? "同期中（押すとオフ）" : "同期";
    urlIn.disabled = keyIn.disabled = on;
    setup.open = !on && !(Sync.url() && Sync.key());
    statusEl.textContent = !on ? "オフ（メモはこの端末の中だけ）"
      : Sync.error ? syncErrText(Sync.error)
      : Sync.status ? Sync.status
      : "オン：保存のたびに送ります" + (Manager.meta.lastSync ? "（最終 " + fmtDate(Manager.meta.lastSync) + "）" : "");
    statusEl.classList.toggle("ng", !!(on && Sync.error));
  };
  Sync.listeners.add(draw);
  draw(); requestAnimationFrame(() => { mounted = true; });
  return h("div", { class: "settings-sec" },
    h("h4", {}, "Googleドライブ同期"),
    h("p", { class: "ai-hint", style: "margin:0" }, "自分のGoogleドライブにもメモを保存します。アプリを入れ直したときや機種変更のときも、同じ接続先と合言葉で「同期」を押せば戻ります。"),
    h("div", { class: "row" }, btn), statusEl, setup);
}
const blobToDataUrl = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
async function exportBackup() {
  try {
    toast("バックアップを作成しています…");
    const files = [];
    for (const f of await Storage.allFiles()) files.push({ id: f.id, name: f.name, type: f.type, createdAt: f.createdAt, data: await blobToDataUrl(f.blob) });
    const payload = { app: "sosaku-memo", version: 1, exportedAt: new Date().toISOString(),
      memos: [...Manager.memos.values()].map(stripRuntime), lists: [...Manager.lists.values()], meta: Manager.meta, files };
    const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
    const d = new Date(), p = (n) => String(n).padStart(2, "0");
    const a = h("a", { href: URL.createObjectURL(blob), download: `hifumiyo-backup-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}.json` });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    Manager.meta.lastBackup = Date.now(); Storage.putMeta(Manager.meta).catch(() => {});
    toast("バックアップを書き出しました（ダウンロードフォルダに保存されます）");
  } catch { toast("バックアップを作成できませんでした", true); }
}
async function importBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { toast("バックアップファイルを読み込めませんでした", true); return; }
  if (!data || data.app !== "sosaku-memo") { toast("ヒフミヨのバックアップファイルではありません", true); return; }
  const ok = await modal({ title: "バックアップを読み込みますか？", message: `メモ${(data.memos || []).length}件・リスト${(data.lists || []).length}件を読み込みます。同じメモがある場合はバックアップの内容で上書きされます。`, buttons: [{ label: "No", value: false }, { label: "Yes", value: true, cls: "primary" }] });
  if (!ok) return;
  try {
    for (const f of data.files || []) { const blob = await (await fetch(f.data)).blob(); await Storage.putFile({ id: f.id, blob, name: f.name, type: f.type, createdAt: f.createdAt || Date.now() }); }
    for (const l of data.lists || []) await Storage.putList(l);
    for (const m of data.memos || []) await Storage.putMemo(stripRuntime(normalizeMemo(m)));
    const hist = [...(Manager.meta.history || []), ...((data.meta && data.meta.history) || [])];
    await Manager.load();
    Manager.meta.history = [...new Set(hist)].slice(0, 3); Storage.putMeta(Manager.meta).catch(() => {});
    toast("バックアップを読み込みました"); resetTo(); afterChange();
  } catch (e) { toast(e && e.code === "quota_exceeded" ? "端末の空き容量が足りません" : "読み込みの途中で失敗しました", true); }
}

/* =========================================================
   Boot
   ========================================================= */
function autosaveOnLeave() { if (activeEditor && activeEditor.isDirty()) activeEditor.save({ auto: true }); }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") autosaveOnLeave(); });
window.addEventListener("pagehide", autosaveOnLeave);
window.addEventListener("online", () => { if (current().name === "search") render(); });
window.addEventListener("offline", () => { if (current().name === "search") render(); });

function scheduleMidnight() {
  const now = new Date(); const next = new Date(now); next.setHours(24, 0, 5, 0);
  setTimeout(async () => { await Manager.maintain(true); if (current().name === "search") render(); scheduleMidnight(); }, next - now);
}

async function boot() {
  applyTheme();
  if (historyOk) try { history.replaceState({ depth: 1 }, ""); } catch {}
  $("#app").append(h("div", { class: "wrap" }, h("p", { class: "ai-hint" }, "メモを読み込んでいます…")));
  await Storage.init();
  try { await Manager.load(); }
  catch (e) { toast("メモを読み込めませんでした。アプリを開き直してください。", true); }
  render();
  Manager.migrateTree().then(() => { if (current().name === "search") render(); }).catch(() => {});
  Manager.maintain(false).catch(() => {});
  scheduleMidnight();
  // 同期がオンなら、起動時にドライブと合わせる（他の端末で書いたメモも取り込む）
  if (Sync.ready()) Sync.schedule(800);
  // ブラウザが容量不足時にデータを消さないよう依頼
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
  // オフライン起動用
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
}
boot();
})();
