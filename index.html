<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>創作メモ帳</title>
<meta name="description" content="体験・学び・アイデアを記録して創作に活かすメモアプリ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#f3f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1c23" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="創作メモ帳">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one-column notebook (max 760px) for 検索・メモ画面; 閲覧画面 splits into 本文 + resizable AI panel on the right edge. */
:root {
  --bg: #f3f4f8;
  --surface: #ffffff;
  --surface-2: #eceef5;
  --line: #dfe2ec;
  --ink: #2c2f3d;
  --ink-2: #636879;
  --ink-3: #9297a8;
  --accent: #6f7bc4;
  --accent-soft: #e4e7f7;
  --accent-ink: #4b56a0;
  --g-exp: #fbe3d8;  --g-exp-ink: #9a5539;
  --g-learn: #d9f0e6; --g-learn-ink: #2f7a5c;
  --g-idea: #ece3f8; --g-idea-ink: #6a4ba3;
  --ok: #d6efe2; --ok-ink: #2d6f51;
  --ng: #f8dde0; --ng-ink: #a23b4b;
  --scrim: rgba(40, 42, 58, .38);
  --shadow: 0 1px 2px rgba(44,47,61,.06), 0 6px 20px rgba(44,47,61,.07);
  --font-body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
  --font-title: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1c23; --surface: #24262f; --surface-2: #2c2f3a; --line: #363a47;
    --ink: #e7e8f0; --ink-2: #b2b6c5; --ink-3: #7f8496;
    --accent: #a5aeea; --accent-soft: #333852; --accent-ink: #c4caf5;
    --g-exp: #4a352e; --g-exp-ink: #f3c4ae;
    --g-learn: #2b4239; --g-learn-ink: #a9e1c8;
    --g-idea: #3b3350; --g-idea-ink: #d3c2f2;
    --ok: #26463a; --ok-ink: #b5e8cf; --ng: #4d2c33; --ng-ink: #f5c0c8;
    --scrim: rgba(0,0,0,.55);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1c23; --surface: #24262f; --surface-2: #2c2f3a; --line: #363a47;
  --ink: #e7e8f0; --ink-2: #b2b6c5; --ink-3: #7f8496;
  --accent: #a5aeea; --accent-soft: #333852; --accent-ink: #c4caf5;
  --g-exp: #4a352e; --g-exp-ink: #f3c4ae;
  --g-learn: #2b4239; --g-learn-ink: #a9e1c8;
  --g-idea: #3b3350; --g-idea-ink: #d3c2f2;
  --ok: #26463a; --ok-ink: #b5e8cf; --ng: #4d2c33; --ng-ink: #f5c0c8;
  --scrim: rgba(0,0,0,.55);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.7;
  -webkit-text-size-adjust: 100%;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent-ink); }

/* ---------- shell ---------- */
.screen { min-height: 100%; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar-in {
  max-width: 760px; margin: 0 auto; padding: 8px 16px;
  display: flex; align-items: center; gap: 8px; min-height: 52px;
}
.topbar-in.wide { max-width: none; }
.topbar h1 { font-size: 16px; font-weight: 700; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand { display: flex; align-items: baseline; gap: 8px; flex: 1; min-width: 0; }
.brand b { font-family: var(--font-title); font-size: 20px; letter-spacing: .04em; }
.brand small { color: var(--ink-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn {
  border: 0; background: transparent; border-radius: 10px; min-width: 40px; height: 40px;
  display: inline-grid; place-items: center; color: var(--ink-2); padding: 0 8px; font-size: 14px;
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn.back { font-size: 22px; color: var(--ink); }
.btn {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 10px; padding: 7px 14px; font-size: 14px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.danger { color: var(--ng-ink); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn:disabled { opacity: .5; cursor: default; }
.wrap { max-width: 760px; width: 100%; margin: 0 auto; padding-inline: 16px; padding-block: 16px 120px; }

/* theme switch */
.switch { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); border: 0; background: none; padding: 6px; }
.switch .track { width: 34px; height: 20px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); position: relative; transition: background .2s; }
.switch .knob { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--ink-3); transition: transform .2s, background .2s; }
.switch[aria-checked="true"] .track { background: var(--accent-soft); }
.switch[aria-checked="true"] .knob { transform: translateX(14px); background: var(--accent); }

/* storage notice */
.notice { font-size: 12px; color: var(--ink-2); background: var(--surface-2); border-radius: 10px; padding: 8px 12px; margin-bottom: 12px; }

/* ---------- search screen ---------- */
.searchbox { position: relative; }
.search-row { display: flex; gap: 8px; }
.search-input {
  flex: 1; min-width: 0; height: 46px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); padding: 0 14px 0 40px; font-size: 16px;
}
.search-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search-ico { position: absolute; left: 13px; top: 13px; width: 20px; height: 20px; color: var(--ink-3); pointer-events: none; }
.search-go { height: 46px; padding: 0 16px; }
.history {
  position: absolute; left: 0; right: 0; top: 52px; z-index: 15;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
  padding: 6px; max-height: 300px; overflow: auto;
}
.history-head { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--ink-3); padding: 4px 8px; }
.history-head button { border: 0; background: none; color: var(--ink-3); font-size: 12px; }
.history-item { display: flex; width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 8px; gap: 10px; align-items: center; }
.history-item:hover { background: var(--surface-2); }
.history-item span { color: var(--ink-3); font-size: 13px; }

.toolbar-row { display: flex; align-items: center; gap: 8px; margin-block: 14px 10px; flex-wrap: wrap; }
.tabs { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; }
.tabs button { border: 0; background: transparent; border-radius: 8px; padding: 5px 14px; font-size: 14px; color: var(--ink-2); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.spacer { flex: 1; }
.result-meta { font-size: 13px; color: var(--ink-3); }
.filter-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--accent-soft); color: var(--accent-ink); border-radius: 999px; padding: 3px 4px 3px 12px; font-size: 13px; }
.filter-chip button { border: 0; background: none; color: inherit; width: 22px; height: 22px; border-radius: 50%; }

.memo-list { display: grid; gap: 10px; }
.memo-card {
  display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface);
  border-radius: var(--radius); padding: 12px 14px; color: inherit;
}
.memo-card:hover { border-color: var(--accent); }
.card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.card-title { font-weight: 700; font-size: 16px; margin-top: 4px; overflow-wrap: anywhere; }
.card-title.untitled { color: var(--ink-3); font-weight: 500; }
.card-sum { font-size: 13.5px; color: var(--ink-2); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.card-sum mark { background: var(--accent-soft); color: var(--accent-ink); border-radius: 3px; padding: 0 1px; }
.card-foot { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
.list-tag.link { background: none; font-family: inherit; cursor: pointer; }
.list-tag.link:hover { border-color: var(--accent); color: var(--accent-ink); }
.list-tag { font-size: 12px; color: var(--ink-2); border: 1px dashed var(--line); border-radius: 6px; padding: 0 7px; }
.att-count { font-size: 12px; color: var(--ink-3); }

.genre { display: inline-flex; align-items: center; font-size: 12px; font-weight: 500; border-radius: 999px; padding: 1px 9px; line-height: 1.6; }
.genre.g-体験 { background: var(--g-exp); color: var(--g-exp-ink); }
.genre.g-学び { background: var(--g-learn); color: var(--g-learn-ink); }
.genre.g-アイデア { background: var(--g-idea); color: var(--g-idea-ink); }
.genre.none { background: var(--surface-2); color: var(--ink-3); }

.list-rows { display: grid; gap: 8px; }
.genre-filter { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.gf-label { font-size: 12px; color: var(--ink-3); margin-right: 2px; }
.gf { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 12px; font-size: 13px; color: var(--ink-2); }
.gf[aria-pressed="true"].all { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); }
.gf[aria-pressed="true"].g-体験 { background: var(--g-exp); color: var(--g-exp-ink); border-color: var(--g-exp-ink); }
.gf[aria-pressed="true"].g-学び { background: var(--g-learn); color: var(--g-learn-ink); border-color: var(--g-learn-ink); }
.gf[aria-pressed="true"].g-アイデア { background: var(--g-idea); color: var(--g-idea-ink); border-color: var(--g-idea-ink); }
.list-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--accent-soft); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; }
.list-head-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--accent-ink); }
.list-head-name { font-size: 17px; font-weight: 700; overflow-wrap: anywhere; }
.list-row { display: flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 4px 4px 4px 0; }
.list-row > button.open { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 8px 14px; color: inherit; }
.list-name { font-weight: 700; overflow-wrap: anywhere; }
.list-sub { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.new-list { display: flex; gap: 8px; margin-bottom: 12px; }
.text-input { width: 100%; min-width: 0; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; font-size: 16px; }
.text-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.empty { text-align: center; color: var(--ink-3); padding: 48px 16px; border: 1px dashed var(--line); border-radius: var(--radius); font-size: 14px; }
.empty b { display: block; color: var(--ink-2); font-size: 15px; margin-bottom: 4px; }

.fab {
  position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 25;
  height: 54px; padding: 0 20px 0 16px; border-radius: 27px; border: 0;
  background: var(--accent); color: var(--surface); font-weight: 700; font-size: 15px;
  display: inline-flex; align-items: center; gap: 6px; box-shadow: var(--shadow);
}
.fab svg { width: 22px; height: 22px; }

/* ---------- view screen ---------- */
.view-shell { flex: 1; display: flex; min-height: 0; position: relative; }
.view-main { flex: 1; min-width: 0; overflow: auto; }
.view-doc { max-width: 720px; margin: 0 auto; padding-inline: 20px 36px; padding-block: 20px 120px; }
.view-title { font-family: var(--font-title); font-size: 1.65em; line-height: 1.4; margin: 6px 0 8px; text-wrap: balance; overflow-wrap: anywhere; letter-spacing: .02em; }
.view-title.untitled { color: var(--ink-3); }
.view-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.view-body { margin-top: 18px; font-size: var(--read-size, 17px); line-height: 1.9; overflow-wrap: anywhere; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; }
.view-body img, .editor img { max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 8px 0; cursor: zoom-in; }
.view-body p, .editor p { margin: 0 0 .6em; }
.zoom { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.zoom button { border: 0; background: var(--surface); width: 36px; height: 32px; color: var(--ink-2); }
.zoom button + button { border-left: 1px solid var(--line); }
.section-h { font-size: 12px; letter-spacing: .08em; color: var(--ink-3); margin: 28px 0 8px; font-weight: 700; }
.att-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.att-tile { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; position: relative; }
.att-tile .thumb { aspect-ratio: 4 / 3; max-width: 100%; background: var(--surface-2); display: grid; place-items: center; color: var(--ink-3); font-size: 12px; font-weight: 700; border: 0; padding: 0; width: 100%; }
.att-tile .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.att-tile .name { font-size: 12px; padding: 5px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
.att-tile a.name { text-decoration: none; }
.att-tile .rm { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: var(--surface); color: var(--ink-2); box-shadow: var(--shadow); }
.ref-list { display: grid; gap: 6px; }
.ref-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; color: inherit; }
.ref-item:hover { border-color: var(--accent); }
.ref-item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ref-item .d { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: 44px; z-index: 30; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; min-width: 150px; }
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 9px 12px; border-radius: 8px; }
.menu button:hover { background: var(--surface-2); }
.menu button.danger { color: var(--ng-ink); }

/* AI panel */
.ai-panel { position: relative; flex: 0 0 auto; background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.ai-panel[data-closed="true"] { border-left: 0; }
.ai-handle {
  position: absolute; top: 50%; transform: translateY(-50%); z-index: 12;
  width: 30px; height: 96px; border: 1px solid var(--line); border-right: 0;
  border-radius: 12px 0 0 12px; background: var(--accent-soft); color: var(--accent-ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  touch-action: none; cursor: ew-resize; font-size: 11px; font-weight: 700; padding: 0;
  user-select: none; -webkit-user-select: none;
}
.ai-handle .arrow { font-size: 14px; line-height: 1; }
.ai-handle .lbl { writing-mode: vertical-rl; letter-spacing: .1em; }
.ai-inner { display: flex; flex-direction: column; height: 100%; min-width: 0; padding: 12px 12px 12px 18px; gap: 10px; }
.ai-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ai-head b { flex: 1; font-size: 14px; }
.ai-head .btn { padding: 4px 9px; font-size: 12px; }
.ai-form { display: flex; gap: 6px; }
.ai-log { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.ai-q { align-self: flex-end; background: var(--accent-soft); color: var(--accent-ink); border-radius: 12px 12px 2px 12px; padding: 6px 12px; font-size: 14px; max-width: 90%; overflow-wrap: anywhere; }
.ai-a { background: var(--surface-2); border-radius: 12px 12px 12px 2px; padding: 10px 12px; font-size: 14px; line-height: 1.75; overflow-wrap: anywhere; }
.ai-a.err { background: var(--ng); color: var(--ng-ink); }
.ai-a ul { margin: 4px 0; padding-left: 1.2em; }
.ai-a .web { display: inline-block; margin-top: 6px; font-size: 12px; }
.ai-hint { font-size: 12.5px; color: var(--ink-3); }
.lookup { display: flex; flex-direction: column; gap: 8px; }
.lookup-tools { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.ext-links { display: contents; }
.ext-links .btn, .lookup-tools .btn { padding: 4px 10px; font-size: 13px; text-decoration: none; }
.wiki-title { font-weight: 700; font-size: 15px; }
.wiki-desc { font-size: 12px; color: var(--ink-3); margin-bottom: 4px; }
.wiki-thumb { display: block; max-width: 100%; max-height: 200px; border-radius: 8px; margin: 6px 0; cursor: zoom-in; }
.wiki-src { font-size: 11px; color: var(--ink-3); margin-top: 6px; }
.wiki-cands { display: flex; flex-wrap: wrap; gap: 6px; }
.ai-out { background: var(--accent-soft); border-radius: 12px; padding: 10px 12px; font-size: 14px; line-height: 1.75; overflow-wrap: anywhere; }
.ai-out.err { background: var(--ng); color: var(--ng-ink); }
.ai-out ul { margin: 4px 0; padding-left: 1.2em; }
.sel-ask { position: fixed; z-index: 40; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); max-width: calc(100vw - 32px); box-shadow: var(--shadow); border-radius: 999px; padding: 10px 18px; font-size: 15px; }
.sel-word { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 14em; }
.view-screen { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px); min-height: 0; }
.view-screen .topbar { position: relative; top: 0; }
.view-screen .view-shell { min-height: 0; overflow: hidden; }
.view-screen .view-main { height: 100%; overscroll-behavior: contain; }
.view-screen .ai-panel { height: 100%; }
.ai-clip { overflow: hidden; height: 100%; min-width: 0; }
.ai-panel[data-closed="true"] .ai-clip { display: none; }

/* ---------- edit screen ---------- */
.field { margin-bottom: 18px; }
.field > label, .field > .label { display: block; font-size: 12px; font-weight: 700; color: var(--ink-2); letter-spacing: .06em; margin-bottom: 6px; }
.title-input { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent; font-family: var(--font-title); font-size: 22px; padding: 6px 2px; }
.title-input:focus { outline: none; border-bottom-color: var(--accent); }
.recent-titles { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
.recent-titles span { font-size: 12px; color: var(--ink-3); }
.chip-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 11px; font-size: 13px; color: var(--ink-2); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  .toast { animation: toastFade 3s steps(1) forwards; }

}

<body>
<div id="app"></div>
<div class="toast-host" id="toasts" aria-live="polite"></div>

<script>
(() => {
"use strict";

/* =========================================================
   Utilities
   ========================================================= */
const $ = (sel, root = document) => root.querySelector(sel);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
};
const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const GENRES = ["体験", "学び", "アイデア"];
const fmtDate = (ms) => {
  const d = new Date(ms);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};
const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; };
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };
const svgIcon = (d) => { const s = document.createElementNS("http://www.w3.org/2000/svg", "svg"); s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor"); s.setAttribute("stroke-width", "2"); s.setAttribute("stroke-linecap", "round"); s.innerHTML = d; return s; };

/* =========================================================
   HTML sanitizer for rich-text body
   ========================================================= */
const OK_TAGS = new Set(["B","STRONG","I","EM","S","STRIKE","DEL","U","SPAN","FONT","A","BR","DIV","P","IMG","UL","OL","LI","BLOCKQUOTE","H3","H4"]);
const okColor = (c) => /^(#[0-9a-f]{3,8}|rgba?\([\d\s.,%]+\))$/i.test((c || "").trim());
function sanitize(html) {
  const tpl = document.createElement("template");
  tpl.innerHTML = html || "";
  const walk = (node) => {
    for (const child of [...node.childNodes]) {
      if (child.nodeType === 3) continue;
      if (child.nodeType !== 1) { child.remove(); continue; }
      if (!OK_TAGS.has(child.tagName)) {
        if (["SCRIPT","STYLE","IFRAME","OBJECT","EMBED"].includes(child.tagName)) { child.remove(); continue; }
        walk(child); child.replaceWith(...child.childNodes); continue;
      }
      const keep = {};
      if (child.tagName === "A") {
        const href = child.getAttribute("href") || "";
        if (/^(https?:|mailto:)/i.test(href)) keep.href = href;
        if (child.dataset.att) keep["data-att"] = child.dataset.att;
      }
      if (child.tagName === "IMG") {
        if (child.dataset.att) keep["data-att"] = child.dataset.att;
        else { const s = child.getAttribute("src") || ""; if (/^https?:/i.test(s)) keep.src = s; }
        keep.alt = child.getAttribute("alt") || "";
      }
      if (child.tagName === "FONT" && okColor(child.getAttribute("color"))) keep.style = "color:" + child.getAttribute("color");
      const col = child.style && child.style.color;
      if (col && okColor(col)) keep.style = "color:" + col;
      for (const a of [...child.attributes]) child.removeAttribute(a.name);
      for (const [k, v] of Object.entries(keep)) child.setAttribute(k, v);
      if (child.tagName === "IMG" && !keep.src && !keep["data-att"]) { child.remove(); continue; }
      walk(child);
    }
  };
  walk(tpl.content);
  return tpl.innerHTML;
}
const htmlToText = (html) => { const t = document.createElement("template"); t.innerHTML = (html || "").replace(/<(br|\/p|\/div|\/li)>/gi, "\n$&"); return (t.content.textContent || "").replace(/\n{3,}/g, "\n\n").trim(); };

/* =========================================================
   Storage: IndexedDB on this device (works offline)
   stores: memos, lists, meta, files (attachment blobs)
   ========================================================= */
const Storage = {
  mode: "idb", idb: null,
  init() {
    return new Promise((resolve) => {
      let req;
      try { req = indexedDB.open("sosaku-memo", 1); } catch { this.mode = "memory"; return resolve(); }
      req.onupgradeneeded = () => {
        const db = req.result;
        for (const s of ["memos", "lists", "meta", "files"]) if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: s === "meta" ? "key" : "id" });
      };
      req.onsuccess = () => { this.idb = req.result; resolve(); };
      req.onerror = () => { this.mode = "memory"; resolve(); };
    });
  },
  _tx(store, mode, fn) {
    if (!this.idb) return Promise.resolve(store === "meta" ? undefined : []);
    return new Promise((resolve, reject) => {
      const tx = this.idb.transaction(store, mode);
      const os = tx.objectStore(store);
      let out;
      const r = fn(os);
      if (r) r.onsuccess = () => { out = r.result; };
      tx.oncomplete = () => resolve(out);
      tx.onerror = () => reject({ code: tx.error && tx.error.name === "QuotaExceededError" ? "quota_exceeded" : "write_failed", message: String(tx.error) });
      tx.onabort = () => reject({ code: tx.error && tx.error.name === "QuotaExceededError" ? "quota_exceeded" : "write_failed", message: String(tx.error) });
    });
  },
  async loadAll() {
    const [memos, lists, meta] = await Promise.all([
      this._tx("memos", "readonly", os => os.getAll()),
      this._tx("lists", "readonly", os => os.getAll()),
      this._tx("meta", "readonly", os => os.get("app")),
    ]);
    return { memos: memos || [], lists: lists || [], meta: meta ? meta.value : {} };
  },
  putMemo(m) { return this._tx("memos", "readwrite", os => os.put(m)); },
  delMemo(id) { return this._tx("memos", "readwrite", os => os.delete(id)); },
  putList(l) { return this._tx("lists", "readwrite", os => os.put(l)); },
  delList(id) { return this._tx("lists", "readwrite", os => os.delete(id)); },
  putMeta(meta) { return this._tx("meta", "readwrite", os => os.put({ key: "app", value: JSON.parse(JSON.stringify(meta)) })); },
  putFile(rec) { return this._tx("files", "readwrite", os => os.put(rec)); },
  getFile(id) { return this._tx("files", "readonly", os => os.get(id)); },
  delFile(id) { return this._tx("files", "readwrite", os => os.delete(id)); },
  allFileIds() { return this._tx("files", "readonly", os => os.getAllKeys()); },
  allFiles() { return this._tx("files", "readonly", os => os.getAll()); },
};

/* attachment blob → object URL cache */
const FileUrls = new Map();
async function ensureFileUrls(atts) {
  let loaded = false;
  for (const a of atts || []) {
    if (!a.fileId || FileUrls.has(a.fileId)) continue;
    const rec = await Storage.getFile(a.fileId).catch(() => null);
    FileUrls.set(a.fileId, rec && rec.blob ? URL.createObjectURL(rec.blob) : "");
    loaded = true;
  }
  return loaded;
}

/* =========================================================
   メモ管理機能 (Manager): in-memory index + persistence
   ========================================================= */
const Manager = {
  memos: new Map(), lists: new Map(), meta: { history: [] }, sorted: [],
  async load() {
    const { memos, lists, meta } = await Storage.loadAll();
    this.memos = new Map(memos.map(m => [m.id, normalizeMemo(m)]));
    this.lists = new Map(lists.map(l => [l.id, l]));
    this.meta = { history: [], ...meta };
    this.reindex();
  },
  reindex() {
    this.sorted = [...this.memos.values()].sort((a, b) => b.updatedAt - a.updatedAt);
    for (const m of this.sorted) m._search = [m.title, m.bodyText, (m.genres || []).join(" "), listNames(m).join(" ")].join("\n").toLowerCase();
  },
  get(id) { return this.memos.get(id) || null; },
  /* 保存依頼 */
  async saveMemo(draft) {
    const now = Date.now();
    const prev = this.memos.get(draft.id);
    const memo = normalizeMemo({ ...draft, createdAt: prev ? prev.createdAt : now, updatedAt: now });
    const touchedLists = new Set([...(memo.listIds || []), ...((prev && prev.listIds) || [])]);
    this.memos.set(memo.id, memo);
    for (const lid of touchedLists) { const l = this.lists.get(lid); if (l) l.updatedAt = now; }
    try {
      await Storage.putMemo(stripRuntime(memo));
      await Promise.all([...touchedLists].map(lid => this.lists.get(lid) && Storage.putList(this.lists.get(lid))));
    } catch (e) {
      if (prev) this.memos.set(prev.id, prev); else this.memos.delete(memo.id);
      this.reindex();
      throw e;
    }
    this.reindex();
    return memo;
  },
  /* 削除依頼 */
  async deleteMemo(id) {
    const prev = this.memos.get(id);
    if (!prev) return;
    const now = Date.now();
    this.memos.delete(id);
    try {
      await Storage.delMemo(id);
      for (const lid of prev.listIds || []) { const l = this.lists.get(lid); if (l) { l.updatedAt = now; await Storage.putList(l); } }
    } catch (e) { this.memos.set(id, prev); this.reindex(); throw e; }
    // 参照されていたリンクを外す
    for (const m of this.memos.values()) {
      if ((m.links || []).includes(id)) { m.links = m.links.filter(x => x !== id); Storage.putMemo(stripRuntime(m)).catch(() => {}); }
    }
    this.reindex();
  },
  async saveList(list) {
    const now = Date.now();
    const l = { createdAt: now, ...list, updatedAt: now };
    const prev = this.lists.get(l.id);
    this.lists.set(l.id, l);
    try { await Storage.putList(l); } catch (e) { if (prev) this.lists.set(prev.id, prev); else this.lists.delete(l.id); throw e; }
    this.reindex();
    return l;
  },
  /* リストに入れるメモをまとめて更新 */
  async setListMembers(listId, memoIds) {
    const want = new Set(memoIds);
    const changed = [];
    for (const m of this.memos.values()) {
      const has = (m.listIds || []).includes(listId);
      if (has === want.has(m.id)) continue;
      m.listIds = has ? m.listIds.filter(x => x !== listId) : [...(m.listIds || []), listId];
      changed.push(m);
    }
    if (!changed.length) return 0;
    for (const m of changed) await Storage.putMemo(stripRuntime(m));
    const l = this.lists.get(listId); if (l) { l.updatedAt = Date.now(); await Storage.putList(l); }
    this.reindex();
    return changed.length;
  },
  async deleteList(id) {
    const prev = this.lists.get(id);
    this.lists.delete(id);
    try { await Storage.delList(id); } catch (e) { if (prev) this.lists.set(id, prev); throw e; }
    for (const m of this.memos.values()) {
      if ((m.listIds || []).includes(id)) { m.listIds = m.listIds.filter(x => x !== id); Storage.putMemo(stripRuntime(m)).catch(() => {}); }
    }
    this.reindex();
  },
  async pushHistory(q) {
    q = q.trim(); if (!q) return;
    this.meta.history = [q, ...(this.meta.history || []).filter(x => x !== q)].slice(0, 10);
    Storage.putMeta(this.meta).catch(() => {});
  },
  async clearHistory() { this.meta.history = []; Storage.putMeta(this.meta).catch(() => {}); },
  recentTitles() {
    const out = [];
    for (const m of this.sorted) { if (m.title && !out.includes(m.title)) out.push(m.title); if (out.length >= 5) break; }
    return out;
  },
  /* 毎日0時の整理: 壊れた参照・リスト紐づけを掃除し、索引を作り直す */
  async maintain(force) {
    if (!force && this.meta.lastMaintenance === todayKey()) return;
    const ids = new Set(this.memos.keys());
    for (const m of this.memos.values()) {
      const links = (m.links || []).filter(x => ids.has(x) && x !== m.id);
      const lists = (m.listIds || []).filter(x => this.lists.has(x));
      if (links.length !== (m.links || []).length || lists.length !== (m.listIds || []).length) {
        m.links = links; m.listIds = lists;
        await Storage.putMemo(stripRuntime(m)).catch(() => {});
      }
    }
    // どのメモからも参照されていない添付ファイルを削除（作成から1日以内のものは編集中の可能性があるので残す）
    try {
      const used = new Set(); for (const m of this.memos.values()) for (const a of m.attachments || []) if (a.fileId) used.add(a.fileId);
      for (const f of await Storage.allFiles()) if (!used.has(f.id) && Date.now() - (f.createdAt || 0) > 864e5) await Storage.delFile(f.id);
    } catch {}
    this.reindex();
    this.meta.lastMaintenance = todayKey();
    await Storage.putMeta(this.meta).catch(() => {});
  },
};
function normalizeMemo(m) {
  const bodyHtml = sanitize(m.bodyHtml || "");
  return {
    id: m.id, title: m.title || "", genres: (m.genres || []).filter(g => GENRES.includes(g)),
    bodyHtml, bodyText: m.bodyText != null ? m.bodyText : htmlToText(bodyHtml),
    attachments: m.attachments || [], links: m.links || [], listIds: m.listIds || [],
    createdAt: m.createdAt || m.updatedAt || Date.now(), updatedAt: m.updatedAt || Date.now(),
  };
}
function stripRuntime(m) { const { _search, ...rest } = m; return rest; }
function listNames(m) { return (m.listIds || []).map(id => Manager.lists.get(id)).filter(Boolean).map(l => l.name); }
function attUrl(att) { if (!att) return ""; if (att.fileId) return FileUrls.get(att.fileId) || ""; return att.url || att.dataUrl || ""; }
function resolveBodyHtml(html, attachments) {
  const tpl = document.createElement("template");
  tpl.innerHTML = html;
  const map = new Map((attachments || []).map(a => [a.id, a]));
  tpl.content.querySelectorAll("[data-att]").forEach(el => {
    const a = map.get(el.dataset.att);
    if (!a) { if (el.tagName === "IMG") el.remove(); else el.replaceWith(...el.childNodes); return; }
    if (el.tagName === "IMG") el.src = attUrl(a); else { el.href = attUrl(a); el.target = "_blank"; el.rel = "noopener"; }
  });
  tpl.content.querySelectorAll("a[href]").forEach(a => { a.target = "_blank"; a.rel = "noopener noreferrer"; });
  return tpl.innerHTML;
}

/* =========================================================
   UI state & navigation (screen stack)
   ========================================================= */
const UI = {
  stack: [{ name: "search" }],
  search: { q: "", committed: "", tab: "memos", order: "desc", genres: [] },
  listView: { order: "desc", genres: [] },
  readSize: lsGet("sm.readSize", 17),
  aiWidth: 0, aiLog: [],
};
const current = () => UI.stack[UI.stack.length - 1];
function go(screen) { UI.stack.push(screen); render(); window.scrollTo(0, 0); }
function back() { if (UI.stack.length > 1) UI.stack.pop(); render(); }
function resetTo(screen) { UI.stack = [{ name: "search" }]; if (screen && screen.name !== "search") UI.stack.push(screen); render(); window.scrollTo(0, 0); }

function toast(msg, ng) {
  const t = h("div", { class: "toast" + (ng ? " ng" : ""), role: "status" }, msg);
  $("#toasts").append(t);

      return h("div", { style: "display:flex;flex-direction:column;min-height:0;flex:1" }, q, listEl,
        h("div", { class: "modal-actions" }, h("button", { class: "btn", type: "button", onclick: () => close(null) }, "キャンセル"),

  // lists
  const listBox = h("div", { class: "chips" });

  // save / delete
  const collect = () => {
    const clone = editor.cloneNode(true);

      return false;
    } finally { saving = false; saveBtn.disabled = false; }
  }
  async function del() {
    const text = htmlToText(collect().bodyHtml);
    if (text.length > 10 && !(await confirmDelete())) return;
    if (!d.savedOnce && !Manager.get(d.id)) { toast("メモを破棄しました"); resetTo(); return; }
    try { await Manager.deleteMemo(d.id); toast("メモを削除しました"); resetTo(); }

  }
  async function goBack() {
    if (d.dirty) {
      const v = await modal({ title: "変更が保存されていません", message: "このまま戻ると、今回の変更は失われます。", buttons: [{ label: "キャンセル", value: null }, { label: "破棄して戻る", value: "discard", cls: "danger" }, { label: "保存して戻る", value: "save", cls: "primary" }] });

    h("header", { class: "topbar" }, h("div", { class: "topbar-in" },
      h("button", { class: "icon-btn back", "aria-label": "戻る", onclick: goBack }, "←"),

    h("div", { class: "edit-actions" }, h("div", { class: "edit-actions-in" }, dirtyEl, h("span", { class: "spacer" }), saveBtn)));

/* file storage: attachment blobs live in IndexedDB on this device */
async function shrinkImage(file, maxSide, quality) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(res => c.toBlob(res, "image/jpeg", quality));
  } finally { URL.revokeObjectURL(url); }
}
async function storeFile(file) {
  const base = { id: uid("a"), name: file.name || "file", type: file.type || "application/octet-stream", size: file.size };
  let blob = file;
  // スマホ写真など大きなJPEGは長辺2400pxに縮小して容量を節約
  if (/^image\/jpe?g$/.test(base.type) && file.size > 2.5 * 1024 * 1024) {
    try { const small = await shrinkImage(file, 2400, 0.85); if (small && small.size < file.size) { blob = small; base.size = small.size; } } catch {}
  }
  const fileId = uid("f");
  try { await Storage.putFile({ id: fileId, blob, name: base.name, type: base.type, createdAt: Date.now() }); }
  catch (e) { throw new Error(e && e.code === "quota_exceeded" ? "端末の空き容量が足りないため添付できませんでした" : `${base.name} を添付できませんでした`); }
  FileUrls.set(fileId, URL.createObjectURL(blob));
  return { ...base, fileId };
}

/* =========================================================
   AI検索 (Claude / Gemini API — キーはこの端末にだけ保存)
   ========================================================= */
const AI_DEFAULTS = { claude: "claude-haiku-4-5-20251001", gemini: "gemini-3.8-flash" };
const getAiConf = () => ({ provider: "claude", key: "", model: "", ...lsGet("sm.ai", {}) });
async function aiAsk(prompt, signal) {
  const c = getAiConf();
  if (!navigator.onLine) throw { code: "offline" };
  if (!c.key) throw { code: "no_key" };
  const model = c.model || AI_DEFAULTS[c.provider];
  let res, data;
  if (c.provider === "gemini") {
    res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(c.key)}`, {
      method: "POST", signal, headers: { "content-type": "application/json" },
      body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: prompt }] }] }),
    });
    data = await res.json().catch(() => ({}));
    if (!res.ok) throw { code: res.status === 429 ? "rate_limited" : "api_error", message: (data.error && data.error.message) || res.status };
    return ((data.candidates || [])[0]?.content?.parts || []).map(p => p.text || "").join("");
  }
  res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST", signal,
    headers: { "content-type": "application/json", "x-api-key": c.key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
    body: JSON.stringify({ model, max_tokens: 1000, messages: [{ role: "user", content: prompt }] }),
  });
  data = await res.json().catch(() => ({}));
  if (!res.ok) throw { code: res.status === 429 ? "rate_limited" : "api_error", message: (data.error && data.error.message) || res.status };
  return (data.content || []).filter(b => b.type === "text").map(b => b.text).join("");
}

const blobToDataUrl = (blob) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); });
async function exportBackup() {
  try {
    toast("バックアップを作成しています…");
    const files = [];
    for (const f of await Storage.allFiles()) files.push({ id: f.id, name: f.name, type: f.type, createdAt: f.createdAt, data: await blobToDataUrl(f.blob) });
    const payload = { app: "sosaku-memo", version: 1, exportedAt: new Date().toISOString(),
      memos: [...Manager.memos.values()].map(stripRuntime), lists: [...Manager.lists.values()], meta: Manager.meta, files };
    const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
    const d = new Date(), p = (n) => String(n).padStart(2, "0");
    const a = h("a", { href: URL.createObjectURL(blob), download: `sosaku-memo-backup-${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}.json` });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    Manager.meta.lastBackup = Date.now(); Storage.putMeta(Manager.meta).catch(() => {});
  } catch { toast("バックアップを作成できませんでした", true); }
}
async function importBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { toast("バックアップファイルを読み込めませんでした", true); return; }
  if (!data || data.app !== "sosaku-memo") { toast("創作メモ帳のバックアップファイルではありません", true); return; }
  const ok = await modal({ title: "バックアップを読み込みますか？", message: `メモ${(data.memos || []).length}件・リスト${(data.lists || []).length}件を読み込みます。同じメモがある場合はバックアップの内容で上書きされます。`, buttons: [{ label: "No", value: false }, { label: "Yes", value: true, cls: "primary" }] });
  if (!ok) return;
  try {
    for (const f of data.files || []) { const blob = await (await fetch(f.data)).blob(); await Storage.putFile({ id: f.id, blob, name: f.name, type: f.type, createdAt: f.createdAt || Date.now() }); }
    for (const l of data.lists || []) await Storage.putList(l);
    for (const m of data.memos || []) await Storage.putMemo(stripRuntime(normalizeMemo(m)));
    const hist = [...(Manager.meta.history || []), ...((data.meta && data.meta.history) || [])];
    await Manager.load();
    Manager.meta.history = [...new Set(hist)].slice(0, 10); Storage.putMeta(Manager.meta).catch(() => {});
    toast("バックアップを読み込みました"); resetTo();
  } catch (e) { toast(e && e.code === "quota_exceeded" ? "端末の空き容量が足りません" : "読み込みの途中で失敗しました", true); }
}

/* =========================================================
   Boot
   ========================================================= */
function autosaveOnLeave() { if (activeEditor && activeEditor.isDirty()) activeEditor.save({ auto: true }); }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") autosaveOnLeave(); });
window.addEventListener("pagehide", autosaveOnLeave);
window.addEventListener("online", () => { if (current().name === "search") render(); });
window.addEventListener("offline", () => { if (current().name === "search") render(); });

function scheduleMidnight() {
  const now = new Date(); const next = new Date(now); next.setHours(24, 0, 5, 0);
  setTimeout(async () => { await Manager.maintain(true); if (current().name === "search") render(); scheduleMidnight(); }, next - now);
}

async function boot() {
  applyTheme();
  $("#app").append(h("div", { class: "wrap" }, h("p", { class: "ai-hint" }, "メモを読み込んでいます…")));
  await Storage.init();
  try { await Manager.load(); }
  catch (e) { toast("メモを読み込めませんでした。アプリを開き直してください。", true); }
  render();
  Manager.maintain(false).catch(() => {});
  scheduleMidnight();
  // ブラウザが容量不足時にデータを消さないよう依頼
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch {}
  // オフライン起動用
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
}
boot();
})();
